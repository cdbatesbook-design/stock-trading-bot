name: Trading Bot Safety Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy
          pip install alpaca-py supabase

      - name: Check Python syntax
        run: |
          python -m compileall -q strategies.py
          python -m compileall -q risk_manager.py
          python -m compileall -q strategy_selector.py
          python -m compileall -q multi_theory_worker.py

      - name: Check strategy imports
        run: |
          python -c "from strategies import evaluate_all, evaluate_strategy_by_id; print('Strategy imports passed')"
          python -c "from risk_manager import calculate_position_size, RiskConfig; print('Risk manager imports passed')"
          python -c "from strategy_selector import rank_strategies, SelectorConfig; print('Strategy selector imports passed')"

      - name: Check all 11 strategies
        run: |
          python - <<'PY'
          import numpy as np
          import pandas as pd
          from strategies import evaluate_all

          dates = pd.date_range(
              end=pd.Timestamp.now(tz="America/New_York").normalize()
                  + pd.Timedelta(hours=15, minutes=55),
              periods=100,
              freq="B",
              tz="America/New_York"
          )

          close = np.linspace(20, 35, len(dates))
          daily = pd.DataFrame({
              "Open": close * 0.995,
              "High": close * 1.02,
              "Low": close * 0.98,
              "Close": close,
              "Volume": np.full(len(dates), 100000)
          }, index=dates)

          intraday_index = pd.date_range(
              start=pd.Timestamp.now(tz="America/New_York").normalize()
                  + pd.Timedelta(hours=9, minutes=30),
              periods=78,
              freq="5min"
          )

          intraday_close = np.linspace(30, 32, len(intraday_index))
          intraday = pd.DataFrame({
              "Open": intraday_close * 0.999,
              "High": intraday_close * 1.003,
              "Low": intraday_close * 0.997,
              "Close": intraday_close,
              "Volume": np.full(len(intraday_index), 10000)
          }, index=intraday_index)

          results = evaluate_all(intraday, daily, daily)

          assert len(results) == 11, (
              f"Expected 11 strategy results, received {len(results)}"
          )

          print("All 11 strategy results returned successfully.")
          for result in results:
              print(
                  f"{result.strategy_id}: "
                  f"{result.action} - {result.reason}"
              )
          PY
